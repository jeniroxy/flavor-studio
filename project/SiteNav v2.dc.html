<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/base.css">
  <link rel="stylesheet" href="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/styles.css">
  <script src="_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/_ds_bundle.js"></script>
</helmet>
<header style="position: sticky; top: 0; z-index: 90; background: rgba(22,34,58,.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.07); font-family: var(--font-sans);">
  <div style="max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 0 24px; height: 60px; position: relative;">
    <a href="Flavor Studio Landing v2.dc.html" style="display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none;">
      <img src="uploads/flovour studio logo.svg" alt="Flavor Studio" style="height: 32px; width: auto; display: block;">
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 26px;">
        <a href="Features v2.dc.html" style="color: {{ cFeatures }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">Features</a>
        <a href="AI Agent.dc.html" style="color: {{ cAgent }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">AI Agent</a>
        <a href="Pricing v2.dc.html" style="color: {{ cPricing }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">Pricing</a>
        <a href="Customers v2.dc.html" style="color: {{ cCustomers }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">Customers</a>
        <a href="Success Stories v2.dc.html" style="color: {{ cStories }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">Stories</a>
        <a href="FAQ v2.dc.html" style="color: {{ cFaq }}; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">FAQ</a>
      </nav>
    </sc-if>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 18px;">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <a href="Contact v2.dc.html" style="color: #c4cedd; font-size: 13px; font-weight: 600; white-space: nowrap; text-decoration: none;" style-hover="color: #ffffff;">Login</a>
      </sc-if>
      <a href="Contact v2.dc.html" style="background: #7fd234; color: #16223a; font-size: 13px; font-weight: 800; padding: 9px 20px; border-radius: 999px; white-space: nowrap; text-decoration: none; transition: background 180ms ease, transform 180ms ease;" style-hover="background: #8ede40; color: #16223a; transform: translateY(-1px);">Request a demo</a>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggleMenu }}" aria-label="Menu" style="all: unset; box-sizing: border-box; width: 38px; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; border-radius: 8px;">
          <span style="display: block; width: 20px; height: 2px; border-radius: 2px; background: #fff; transition: transform 220ms ease, opacity 180ms ease; transform: {{ bar1 }};"></span>
          <span style="display: block; width: 20px; height: 2px; border-radius: 2px; background: #fff; transition: opacity 160ms ease; opacity: {{ bar2op }};"></span>
          <span style="display: block; width: 20px; height: 2px; border-radius: 2px; background: #fff; transition: transform 220ms ease; transform: {{ bar3 }};"></span>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top: 1px solid rgba(255,255,255,.1); background: rgba(22,34,58,.98); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
      <nav style="display: flex; flex-direction: column; padding: 8px 24px 18px;">
        <a href="Features v2.dc.html" onClick="{{ closeMenu }}" style="color: {{ cFeatures }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">Features</a>
        <a href="AI Agent.dc.html" onClick="{{ closeMenu }}" style="color: {{ cAgent }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">AI Agent</a>
        <a href="Pricing v2.dc.html" onClick="{{ closeMenu }}" style="color: {{ cPricing }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">Pricing</a>
        <a href="Customers v2.dc.html" onClick="{{ closeMenu }}" style="color: {{ cCustomers }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">Customers</a>
        <a href="Success Stories v2.dc.html" onClick="{{ closeMenu }}" style="color: {{ cStories }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">Success stories</a>
        <a href="FAQ v2.dc.html" onClick="{{ closeMenu }}" style="color: {{ cFaq }}; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07);">FAQ</a>
        <a href="Contact v2.dc.html" onClick="{{ closeMenu }}" style="color: #c4cedd; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; padding: 13px 0;">Login</a>
      </nav>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 60 },
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;features&quot;, &quot;agent&quot;, &quot;pricing&quot;, &quot;customers&quot;, &quot;stories&quot;, &quot;faq&quot;], &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Which nav item is highlighted&quot; }
}">
class Component extends DCLogic {
  state = { isDesktop: true, menuOpen: false };
  componentDidMount() {
    this._mq = window.matchMedia('(max-width: 960px)');
    this._onMq = () => this.setState({ isDesktop: !this._mq.matches, menuOpen: this._mq.matches ? this.state.menuOpen : false });
    this._mq.addEventListener('change', this._onMq);
    this._onMq();
  }
  componentWillUnmount() {
    if (this._mq) this._mq.removeEventListener('change', this._onMq);
  }
  renderVals() {
    const a = this.props.active || '';
    const c = k => (a === k ? '#ffffff' : '#c4cedd');
    const open = this.state.menuOpen;
    return {
      isDesktop: this.state.isDesktop,
      isMobile: !this.state.isDesktop,
      menuOpen: !this.state.isDesktop && open,
      bar1: open ? 'translateY(6px) rotate(45deg)' : 'none',
      bar2op: open ? '0' : '1',
      bar3: open ? 'translateY(-6px) rotate(-45deg)' : 'none',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      cFeatures: c('features'),
      cAgent: c('agent'),
      cPricing: c('pricing'),
      cCustomers: c('customers'),
      cStories: c('stories'),
      cFaq: c('faq')
    };
  }
}
</script>
</body>
</html>
