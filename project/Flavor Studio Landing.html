  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0: #324561;   /* top nav, dark surfaces, headings */\n  --slate-700: #3e5a7f;   /* primary brand text / wordmark */\n  --slate-600: #4a6896;\n  --slate-500: #6178a0;\n  --slate-400: #8891a7;   /* placeholder / disabled label */\n  --slate-300: #9db0c9;   /* muted / secondary text */\n  --slate-200: #c4cedd;\n  --slate-100: #dfe5ee;\n\n  /* ---- Primary: sky blue (actions, links, selection) ---- */\n  --blue-700: #2060a6;\n  --blue-600: #3da4f1;\n  --blue-500: #59a3eb;   /* PRIMARY — buttons, active states */\n  --blue-400: #74a9e0;\n  --blue-300: #b5d5f4;\n  --blue-200: #deedfb;   /* selected row / chip fill */\n  --blue-100: #eef6fd;   /* hover tint */\n  --blue-050: #f8fbfe;   /* faint section tint */\n\n  /* ---- Brand accent: lime citrus (logo, highlights, success-ish) ---- */\n  --lime-500: #8cd135;   /* logo core */\n  --lime-400: #a8dd5e;\n  --lime-300: #d0f16b;\n  --lime-200: #efff84;   /* logo gradient top */\n  --lime-100: #f1f8e2;\n\n  /* ---- Semantic accents (sparse, from the file) ---- */\n  --teal-500: #18bc9c;   /* success / positive */\n  --teal-100: #e3f7f2;\n  --amber-500: #efc051;  /* warning / pending */\n  --amber-100: #fcf3da;\n  --violet-500: #7b61ff; /* special tags / AI */\n  --violet-100: #eee9ff;\n  --red-500: #e5484d;    /* destructive / error */\n  --red-100: #fdebec;\n\n  /* ---- Neutrals (surfaces, borders, dividers) ---- */\n  --white: #ffffff;\n  --gray-050: #f9f9fb;\n  --gray-100: #f3f3f6;   /* app canvas background */\n  --gray-150: #f7f7fa;\n  --gray-200: #eeeeee;\n  --gray-300: #e9e9e9;   /* default border / divider */\n  --gray-400: #d9d9d9;\n  --black: #000000;\n\n  /* ============================================================\n     Semantic aliases — prefer these in components\n     ============================================================ */\n\n  /* Text */\n  --text-strong:   var(--slate-800);  /* headings, key numbers */\n  --text-body:     var(--slate-700);  /* default body copy */\n  --text-muted:    var(--slate-300);  /* secondary / captions */\n  --text-placeholder: var(--slate-400);\n  --text-on-dark:  var(--white);\n  --text-link:     var(--blue-500);\n  --text-inverse:  var(--white);\n\n  /* Surfaces */\n  --surface-canvas:   var(--gray-100); /* page background */\n  --surface-card:     var(--white);    /* cards, panels, rows */\n  --surface-raised:   var(--white);\n  --surface-sunken:   var(--gray-050);\n  --surface-nav:      var(--slate-800);/* dark top navigation */\n  --surface-subnav:   var(--blue-500); /* admin blue sub-bar */\n  --surface-selected: var(--blue-200);\n  --surface-hover:    var(--blue-100);\n  --surface-accent:   var(--blue-500); /* panel headers, fills */\n  --surface-accent-deep: var(--slate-700);\n\n  /* Borders */\n  --border-default: var(--gray-300);\n  --border-strong:  var(--slate-200);\n  --border-input:   var(--gray-300);\n  --border-focus:   var(--blue-500);\n\n  /* Interactive / brand */\n  --brand:          var(--slate-700);\n  --brand-mark:     var(--lime-500);\n  --primary:        var(--blue-500);\n  --primary-hover:  var(--blue-600);\n  --primary-active: var(--blue-700);\n  --primary-soft:   var(--blue-200);\n\n  /* Feedback */\n  --success: var(--teal-500);\n  --warning: var(--amber-500);\n  --danger:  var(--red-500);\n  --info:    var(--blue-500);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(89, 163, 235, 0.35);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Flavor Studio — Typography tokens\n   Primary face: Mulish (≈ Avenir Next). Display companion: Manrope.\n   The product UI is compact and data-dense: 13–14px body, medium\n   weight for most labels, demi-bold for emphasis.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-sans: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n  --font-display: 'Manrope', 'Mulish', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;\n\n  /* ---- Weights (mapped from Avenir Next usage) ---- */\n  --weight-regular: 400;  /* Regular */\n  --weight-medium: 500;   /* Medium — the workhorse weight */\n  --weight-semibold: 600; /* Demi Bold — emphasis, headings */\n  --weight-bold: 700;     /* Bold */\n  --weight-extrabold: 800;/* Display / wordmark */\n\n  /* ---- Type scale (px → rem at 16px base) ---- */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels */\n  --text-xs: 0.75rem;     /* 12px — captions, table meta */\n  --text-sm: 0.8125rem;   /* 13px — dense body, inputs */\n  --text-base: 0.875rem;  /* 14px — default body / nav */\n  --text-md: 1rem;        /* 16px — emphasized body */\n  --text-lg: 1.125rem;    /* 18px — sub-headings */\n  --text-xl: 1.25rem;     /* 20px — panel titles */\n  --text-2xl: 1.5rem;     /* 24px — section headings */\n  --text-3xl: 2rem;       /* 32px — page titles */\n  --text-4xl: 2.75rem;    /* 44px — hero */\n  --text-display: 4.5rem; /* 72px — marketing / cover */\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.45;\n  --leading-relaxed: 1.6;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;    /* nav items, eyebrows */\n  --tracking-wider: 0.08em;   /* ALL-CAPS table headers */\n\n  /* ---- Semantic text roles ---- */\n  --font-page-title: var(--weight-medium) var(--text-3xl)/var(--leading-tight) var(--font-sans);\n  --font-section-title: var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-sans);\n  --font-body: var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-sans);\n  --font-body-medium: var(--weight-medium) var(--text-base)/var(--leading-normal) var(--font-sans);\n  --font-label: var(--weight-medium) var(--text-sm)/var(--leading-snug) var(--font-sans);\n  --font-caption: var(--weight-regular) var(--text-xs)/var(--leading-normal) var(--font-sans);\n  --font-eyebrow: var(--weight-semibold) var(--text-xs)/1 var(--font-sans);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Flavor Studio — Spacing, radius, shadow, layout tokens\n   The product is built on an 8px soft grid with 4px half-steps.\n   Corners are gently rounded (6–10px on controls, pill on chips).\n   Shadows are whisper-soft and cool-neutral, never heavy.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4 / 8 grid) ---- */\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 8px;\n  --space-4: 12px;\n  --space-5: 16px;\n  --space-6: 20px;\n  --space-7: 24px;\n  --space-8: 32px;\n  --space-9: 40px;\n  --space-10: 48px;\n  --space-12: 64px;\n  --space-16: 80px;   /* page gutter on wide views */\n\n  /* ---- Radii ---- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;     /* inputs, small buttons */\n  --radius-md: 8px;     /* buttons, fields */\n  --radius-lg: 10px;    /* cards, panels */\n  --radius-xl: 14px;    /* modals */\n  --radius-2xl: 20px;\n  --radius-pill: 999px; /* chips, version tabs, avatars */\n  --radius-circle: 50%;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-thick: 2px;\n\n  /* ---- Shadows (cool, low-opacity, layered) ---- */\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);\n  --shadow-sm: 0 1px 3px rgba(46, 59, 83, 0.06), 0 1px 2px rgba(46, 59, 83, 0.04);\n  --shadow-md: 0 2px 8px rgba(46, 59, 83, 0.08), 0 1px 3px rgba(46, 59, 83, 0.05);\n  --shadow-lg: 0 8px 24px rgba(46, 59, 83, 0.12), 0 2px 6px rgba(46, 59, 83, 0.06);\n  --shadow-xl: 0 18px 48px rgba(46, 59, 83, 0.18);\n  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);\n  /* inset top shadow used under the dark top-nav */\n  --shadow-inset-top: inset 0 3px 4px rgba(0, 0, 0, 0.15);\n  --shadow-focus: var(--focus-ring);\n\n  /* ---- Layout ---- */\n  --nav-height: 50px;\n  --subnav-height: 74px;\n  --page-gutter: 80px;\n  --content-max: 1280px;\n  --sidebar-width: 360px;\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 180ms; /* @kind other */\n  --duration-slow: 280ms; /* @kind other */\n  --transition-base: all var(--duration-base) var(--ease-standard);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Flavor Studio — Base / reset layer\n   Sensible defaults so specimens & components inherit the brand\n   without each file re-declaring fonts and colors.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  font-weight: var(--weight-regular);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-canvas);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  color: var(--text-strong);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-snug);\n}\n\np { margin: 0; }\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\nbutton {\n  font-family: inherit;\n  cursor: pointer;\n}\n\nimg { display: block; max-width: 100%; }\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--focus-ring);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Flavor Studio — Design System\n   Global stylesheet entry point.\n   Consuming projects link THIS file only. Keep it a list of\n   @imports — declare real rules in the imported token files.\n nt-display: swap;\n  src: url(\"9d33c23f-e7d9-4e13-90cb-7620e70a0bb4\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"25d58504-c3af-4332-9f12-3989fb950842\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"43e0cccf-2c8c-451b-aea2-5cad132b3211\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"45eb5912-9e0e-4922-97aa-c3bf0561596e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Flavor Studio — Color tokens\n   A calm, professional palette: slate navy structure, a friendly\n   sky-blue primary action color, and a lime-citrus brand accent\n   borrowed from the logo mark.\n   ============================================================ */\n\n:root {\n  /* ---- Brand: slate (structure, text, headers) ---- */\n  --slate-900: #2b3b53;   /* deepest ink */\n  --slate-800: #324561;   /* top nav, dark surfaces, headings */\n  --slate-700: #3e5a7f;   /* primary brand text / wordmark */\n  --slate-600: #4a6896;\n  --slate-500: #6178a0;\n  --slate-400: #8891a7;   /* placeholder / disabled label */\n  --slate-300: #9db0c9;   /* muted / secondary text */\n  --slate-200: #c4cedd;\n  --slate-100: #dfe5ee;\n\n  /* ---- Primary: sky blue (actions, links, selection) ---- */\n  --blue-700: #2060a6;\n  --blue-600: #3da4f1;\n  --blue-500: #59a3eb;   /* PRIMARY — buttons, active states */\n  --blue-400: #74a9e0;\n  --blue-300: #b5d5f4;\n  --blue-200: #deedfb;   /* selected row / chip fill */\n  --blue-100: #eef6fd;   /* hover tint */\n  --blue-050: #f8fbfe;   /* faint section tint */\n\n  /* ---- Brand accent: lime citrus (logo, highlights, success-ish) ---- */\n  --lime-500: #8cd135;   /* logo core */\n  --lime-400: #a8dd5e;\n  --lime-300: #d0f16b;\n  --lime-200: #efff84;   /* logo gradient top */\n  --lime-100: #f1f8e2;\n\n  /* ---- Semantic accents (sparse, from the file) ---- */\n  --teal-500: #18bc9c;   /* success / positive */\n  --teal-100: #e3f7f2;\n  --amber-500: #efc051;  /* warning / pending */\n  --amber-100: #fcf3da;\n  --violet-500: #7b61ff; /* special tags / AI */\n  --violet-100: #eee9ff;\n  --red-500: #e5484d;    /* destructive / error */\n  --red-100: #fdebec;\n\n  /* ---- Neutrals (surfaces, borders, dividers) ---- */\n  --white: #ffffff;\n  --gray-050: #f9f9fb;\n  --gray-100: #f3f3f6;   /* app canvas background */\n  --gray-150: #f7f7fa;\n  --gray-200: #eeeeee;\n  --gray-300: #e9e9e9;   /* default border / divider */\n  --gray-400: #d9d9d9;\n  --black: #000000;\n\n  /* ============================================================\n     Semantic aliases — prefer these in components\n     ============================================================ */\n\n  /* Text */\n  --text-strong:   var(--slate-800);  /* headings, key numbers */\n  --text-body:     var(--slate-700);  /* default body copy */\n  --text-muted:    var(--slate-300);  /* secondary / captions */\n  --text-placeholder: var(--slate-400);\n  --text-on-dark:  var(--white);\n  --text-link:     var(--blue-500);\n  --text-inverse:  var(--white);\n\n  /* Surfaces */\n  --surface-canvas:   var(--gray-100); /* page background */\n  --surface-card:     var(--white);    /* cards, panels, rows */\n  --surface-raised:   var(--white);\n  --surface-sunken:   var(--gray-050);\n  --surface-nav:      var(--slate-800);/* dark top navigation */\n  --surface-subnav:   var(--blue-500); /* admin blue sub-bar */\n  --surface-selected: var(--blue-200);\n  --surface-hover:    var(--blue-100);\n  --surface-accent:   var(--blue-500); /* panel headers, fills */\n  --surface-accent-deep: var(--slate-700);\n\n  /* Borders */\n  --border-default: var(--gray-300);\n  --border-strong:  var(--slate-200);\n  --border-input:   var(--gray-300);\n  --border-focus:   var(--blue-500);\n\n  /* Interactive / brand */\n  --brand:          var(--slate-700);\n  --brand-mark:     var(--lime-500);\n  --primary:        var(--blue-500);\n  --primary-hover:  var(--blue-600);\n  --primary-active: var(--blue-700);\n  --primary-soft:   var(--blue-200);\n\n  /* Feedback */\n  --success: var(--teal-500);\n  --warning: var(--amber-500);\n  --danger:  var(--red-500);\n  --info:    var(--blue-500);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(89, 163, 235, 0.35);\n}\n\n/* ============================================================\n   Flavor Studio — Typography tokens\n   Primary face: Mulish (≈ Avenir Next). Display companion: Manrope.\n   The product UI is compact and data-dense: 13–14px body, medium\n   weight for most labels, demi-bold for emphasis.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-sans: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n  --font-display: 'Manrope', 'Mulish', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;\n\n  /* ---- Weights (mapped from Avenir Next usage) ---- */\n  --weight-regular: 400;  /* Regular */\n  --weight-medium: 500;   /* Medium — the workhorse weight */\n  --weight-semibold: 600; /* Demi Bold — emphasis, headings */\n  --weight-bold: 700;     /* Bold */\n  --weight-extrabold: 800;/* Display / wordmark */\n\n  /* ---- Type scale (px → rem at 16px base) ---- */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels */\n  --text-xs: 0.75rem;     /* 12px — captions, table meta */\n  --text-sm: 0.8125rem;   /* 13px — dense body, inputs */\n  --text-base: 0.875rem;  /* 14px — default body / nav */\n  --text-md: 1rem;        /* 16px — emphasized body */\n  --text-lg: 1.125rem;    /* 18px — sub-headings */\n  --text-xl: 1.25rem;     /* 20px — panel titles */\n  --text-2xl: 1.5rem;     /* 24px — section headings */\n  --text-3xl: 2rem;       /* 32px — page titles */\n  --text-4xl: 2.75rem;    /* 44px — hero */\n  --text-display: 4.5rem; /* 72px — marketing / cover */\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.45;\n  --leading-relaxed: 1.6;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;    /* nav items, eyebrows */\n  --tracking-wider: 0.08em;   /* ALL-CAPS table headers */\n\n  /* ---- Semantic text roles ---- */\n  --font-page-title: var(--weight-medium) var(--text-3xl)/var(--leading-tight) var(--font-sans);\n  --font-section-title: var(--weight-semibold) var(--text-xl)/var(--leading-snug) var(--font-sans);\n  --font-body: var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font-sans);\n  --font-body-medium: var(--weight-medium) var(--text-base)/var(--leading-normal) var(--font-sans);\n  --font-label: var(--weight-medium) var(--text-sm)/var(--leading-snug) var(--font-sans);\n  --font-caption: var(--weight-regular) var(--text-xs)/var(--leading-normal) var(--font-sans);\n  --font-eyebrow: var(--weight-semibold) var(--text-xs)/1 var(--font-sans);\n}\n\n/* ============================================================\n   Flavor Studio — Spacing, radius, shadow, layout tokens\n   The product is built on an 8px soft grid with 4px half-steps.\n   Corners are gently rounded (6–10px on controls, pill on chips).\n   Shadows are whisper-soft and cool-neutral, never heavy.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4 / 8 grid) ---- */\n  --space-0: 0;\n  --space-1: 2px;\n  --space-2: 4px;\n  --space-3: 8px;\n  --space-4: 12px;\n  --space-5: 16px;\n  --space-6: 20px;\n  --space-7: 24px;\n  --space-8: 32px;\n  --space-9: 40px;\n  --space-10: 48px;\n  --space-12: 64px;\n  --space-16: 80px;   /* page gutter on wide views */\n\n  /* ---- Radii ---- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;     /* inputs, small buttons */\n  --radius-md: 8px;     /* buttons, fields */\n  --radius-lg: 10px;    /* cards, panels */\n  --radius-xl: 14px;    /* modals */\n  --radius-2xl: 20px;\n  --radius-pill: 999px; /* chips, version tabs, avatars */\n  --radius-circle: 50%;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-thick: 2px;\n\n  /* ---- Shadows (cool, low-opacity, layered) ---- */\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);\n  --shadow-sm: 0 1px 3px rgba(46, 59, 83, 0.06), 0 1px 2px rgba(46, 59, 83, 0.04);\n  --shadow-md: 0 2px 8px rgba(46, 59, 83, 0.08), 0 1px 3px rgba(46, 59, 83, 0.05);\n  --shadow-lg: 0 8px 24px rgba(46, 59, 83, 0.12), 0 2px 6px rgba(46, 59, 83, 0.06);\n  --shadow-xl: 0 18px 48px rgba(46, 59, 83, 0.18);\n  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);\n  /* inset top shadow used under the dark top-nav */\n  --shadow-inset-top: inset 0 3px 4px rgba(0, 0, 0, 0.15);\n  --shadow-focus: var(--focus-ring);\n\n  /* ---- Layout ---- */\n  --nav-height: 50px;\n  --subnav-height: 74px;\n  --page-gutter: 80px;\n  --content-max: 1280px;\n  --sidebar-width: 360px;\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 180ms; /* @kind other */\n  --duration-slow: 280ms; /* @kind other */\n  --transition-base: all var(--duration-base) var(--ease-standard);\n}\n\n/* ============================================================\n   Flavor Studio — Base / reset layer\n   Sensible defaults so specimens & components inherit the brand\n   without each file re-declaring fonts and colors.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  font-weight: var(--weight-regular);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-canvas);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  color: var(--text-strong);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-snug);\n}\n\np { margin: 0; }\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\nbutton {\n  font-family: inherit;\n  cursor: pointer;\n}\n\nimg { display: block; max-width: 100%; }\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--focus-ring);\n}\n\n<\u002Fstyle>\n  <script src=\"67f50426-b9a1-44d5-855f-8b5f14f9308f\"><\u002Fscript>\n  <script src=\"0a451ca9-bd61-47f0-8416-1857317fb16a\"><\u002Fscript>\n  <script src=\"3bc1df0e-a88a-4634-aeab-49ca199bf597\"><\u002Fscript>\n  <script src=\"8fb8e563-cdb5-45d5-b987-564c2888bd2c\"><\u002Fscript>\n  <style>\n    html { scroll-behavior: smooth; }\n    body { margin: 0; background: #ffffff; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }\n    a { color: var(--blue-500); text-decoration: none; }\n    a:hover { color: var(--blu ght: 1.06; letter-spacing: -0.02em; color: #fff; margin: 0;\">Ready to build your next bestseller?<\u002Fh2>\n      <p data-reveal=\"\" data-reveal-delay=\"0.08\" style=\"font-size: 17px; line-height: 1.65; color: var(--slate-300); margin: 20px auto 0; max-width: 46ch;\">See Flavor Studio and its AI Agent on your own formulas. A 30-minute demo, tailored to your category.<\u002Fp>\n      <div data-reveal=\"\" data-reveal-delay=\"0.16\" style=\"display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 34px;\">\n        <a href=\"Contact.dc.html\" style=\"background: var(--blue-500); color: #fff; font-size: 16px; font-weight: 700; padding: 15px 32px; border-radius: 10px; white-space: nowrap; box-shadow: 0 12px 30px rgba(89,163,235,.4); transition: background 180ms ease, transform 180ms ease;\" style-hover=\"background: var(--blue-600); color: #fff; transform: translateY(-2px);\">Request a demo<\u002Fa>\n        <a href=\"mailto:info@senspirellc.com\" style=\"border: 1px solid rgba(255,255,255,.28); color: #fff; font-size: 16px; font-weight: 700; padding: 15px 32px; border-radius: 10px; white-space: nowrap; transition: background 180ms ease;\" style-hover=\"background: rgba(255,255,255,.1); color: #fff;\">Talk to sales<\u002Fa>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"0.24\" style=\"font-size: 13px; color: var(--slate-500); margin-top: 22px;\">No credit card. No 40-page onboarding doc. Just food science.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background: var(--slate-900); border-top: 1px solid rgba(255,255,255,.08); padding: 48px 24px 36px;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;\">\n      <div style=\"max-width: 280px;\">\n        <div style=\"display: flex; align-items: center; gap: 10px;\">\n          <img src=\"aa9cb2fc-78aa-4181-ad4f-de7049a5512f\" alt=\" ar(--slate-300); font-size: 13.5px;\" style-hover=\"color: #ffffff;\">FAQ<\u002Fa>\n          <a href=\"Contact.dc.html\" style=\"color: var(--slate-300); font-size: 13.5px;\" style-hover=\"color: #ffffff;\">Contact<\u002Fa>\n          <a href=\"mailto:info@senspirellc.com\" style=\"color: var(--slate-300); font-size: 13.5px;\" style-hover=\"color: #ffffff;\">info@senspirellc.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1180px; margin: 36px auto 0; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-size: 12.5px; color: var(--slate-500);\">\n      <span>© {{ year }} Senspire Co. All rights reserved. A Senspire solution.<\u002Fspan>\n      <span>Privacy · Terms · Support<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showAnnouncement&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Header&quot;, &quot;description&quot;: &quot;Show the IFT / AI Agent announcement bar&quot; },\n  &quot;pauseLoops&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot;, &quot;description&quot;: &quot;Play the hero walkthrough once instead of looping&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { faqOpen: 0, isDesktop: true, menuOpen: false, chat: [], chatInput: '', chatLoading: false, chatError: '' };\n\n  componentDidMount() {\n    this._alive = true;\n    this._mq = window.matchMedia('(max-width: 820px)');\n    this._onMq = () => this.setState({ isDesktop: !this._mq.matches, menuOpen: this._mq.matches ? this.state.menuOpen : false });\n    this._mq.addEventListener('change', this._onMq);\n    this._onMq();\n    this._poll = setInterval(() => {\n      if (window.gsap && window.ScrollTrigger) {\n        clearInterval(this._poll);\n        this._setup();\n      }\n    }, 80);\n  }\n\n  componentDidUpdate() {\n    const el = document.querySelector('[data-chatscroll]');\n    if (el) el.scrollTop = el.scrollHeight;\n  }\n\n  async _ask(question) {\n    const q = (question || '').trim();\n    if (!q || this.state.chatLoading) return;\n    const history = this.state.chat.concat([{ role: 'user', text: q }]);\n    this.setState({ chat: history, chatInput: '', chatLoading: true, chatError: '' });\n    try {\n      if (!window.claude || !window.claude.complete) throw new Error('offline');\n      const messages = history.map(m => ({ role: m.role === 'agent' ? 'assistant' : 'user', content: m.text }));\n      const system = \"You are the AI Agent inside Flavor Studio, a food R&D and recipe-formulation platform for product developers and food scientists. Answer questions about recipe formulation, ingredient substitutions, nutrition, allergens (big-9), FDA/CFIA labeling and nutrient content claims, yield and costing. Be concise (usually 2-5 sentences or a short list), precise and operational — talk like a food technologist, not marketing. Use explicit units ($, g, %, mg). When a claim would reference a regulation or data source, end with a short 'Sources:' line naming plausible references (e.g. 21 CFR 101.61, USDA FoodData Central, ingredient library). This is a public demo, so invent reasonable illustrative figures rather than asking for the user's data, but keep them realistic. No emoji.\";\n      const raw = await window.claude.complete({ system, messages, max_tokens: 700 });\n      if (!this._alive) return;\n      const clean = (raw || '')\n        .replace(/\\*\\*(.*?)\\*\\*/g, '$1')\n        .replace(/(^|\\s)\\*(?!\\s)(.*?)\\*/g, '$1$2')\n        .replace(/^#{1,6}\\s+/gm, '')\n        .replace(/^\\s*[-*]\\s+/gm, '• ')\n        .trim();\n      this.setState({ chat: this.state.chat.concat([{ role: 'agent', text: clean || 'Sorry, I could not generate a response — try rephrasing.' }]), chatLoading: false });\n    } catch (e) {\n      if (!this._alive) return;\n      this.setState({ chatLoading: false, chatError: \"The Agent is unavailable right now — this live demo needs a connection. Request a demo to see it on your own data.\" });\n    }\n  }\n\n  componentWillUnmount() {\n    this._alive = false;\n    clearInterval(this._poll);\n    if (this._mq) this._mq.removeEventListener('change', this._onMq);\n    if (window.ScrollTrigger) window.ScrollTrigger.getAll().forEach(t => t.kill());\n    if (this._tl) this._tl.kill();\n  }\n\n  _setup() {\n    const g = window.gsap;\n    const _io = (el, cb) => {\n      if (!el) return;\n      let done = false;\n      const run = () => { if (done) return; done = true; cb(el); };\n      const o = new IntersectionObserver((ents) => {\n        ents.forEach(e => { if (e.isIntersecting) { o.unobserve(el); run(); } });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      o.observe(el);\n    };\n    // Failsafe: if animation frames never run (non-composited/hidden render),\n    // apply the final resting state synchronously so nothing stays hidden.\n    const _finalize = () => {\n      const cp = { clearProps: 'opacity,transform,translate,rotate,scale,x,y' };\n      g.utils.toArray('[data-reveal]').forEach(el => g.set(el, cp));\n      g.utils.toArray('[data-bar]').forEach(el => g.set(el, { scaleX: 1 }));\n      ['[data-srow]','[data-kcard]','[data-icard]','[data-crow]','[data-trow]','[data-lrow]','[data-smsg]'].forEach(sel =>\n        g.utils.toArray(sel).forEach(el => g.set(el, cp)));\n      g.utils.toArray('[data-count]').forEach(el => {\n        const end = parseFloat(el.getAttribute('data-count'));\n        const dec = parseInt(el.getAttribute('data-decimals') || '0', 10);\n        const suf = el.getAttribute('data-suffix') || '';\n        const pre = el.getAttribute('data-prefix') || '';\n        el.textContent = pre + end.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;\n      });\n    };\n    let _rafOk = false;\n    requestAnimationFrame(() => { _rafOk = true; });\n    setTimeout(() => { if (!_rafOk) _finalize(); }, 450);\n    setTimeout(() => { if (!_rafOk) _finalize(); }, 2600);\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches || (this.props.pauseLoops === true);\n\n    // Scroll reveals\n    g.utils.toArray('[data-reveal]').forEach(el => {\n      g.set(el, { y: 30, opacity: 0 });\n      _io(el, t => g.to(t, { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out', delay: parseFloat(t.getAttribute('data-reveal-delay') || '0') }));\n    });\n\n    // Count-ups\n    g.utils.toArray('[data-count]').forEach(el => {\n      const end = parseFloat(el.getAttribute('data-count'));\n      const dec = parseInt(el.getAttribute('data-decimals') || '0', 10);\n      const suf = el.getAttribute('data-suffix') || '';\n      const pre = el.getAttribute('data-prefix') || '';\n      _io(el, () => {\n        const obj = { v: 0 };\n        g.to(obj, {\n          v: end, duration: 1.8, ease: 'power2.out',\n          onUpdate: () => {\n            el.textContent = pre + obj.v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;\n          }\n        });\n      });\n    });\n\n    // Formulation table rows\n    _io(document.querySelector('[data-formula]'), () => g.from('[data-trow]', {\n      x: -26, opacity: 0, duration: 0.55, ease: 'power2.out', stagger: 0.12\n    }));\n\n    // Nutrition label rows draw in\n    _io(document.querySelector('[data-label]'), () => g.from('[data-lrow]', {\n      opacity: 0, x: -14, duration: 0.4, ease: 'power2.out', stagger: 0.09\n    }));\n\n    // AI Agent conversation reveal\n    _io(document.querySelector('[data-schat]'), () => g.from('[data-smsg]', {\n      y: 18, opacity: 0, duration: 0.6, ease: 'power2.out', stagger: 0.35\n    }));\n\n    // Hero: live walkthrough card\n    if (document.querySelector('[data-walk]')) this._walkthrough(g, reduce);\n  }\n\n  _walkthrough(g, reduce) {\n    const q = s => document.querySelector(s);\n    const panels = [0, 1, 2, 3].map(i => q('[data-wpanel=\"' + i + '\"]'));\n    const bars = [0, 1, 2, 3].map(i => q('[data-wbar=\"' + i + '\"]'));\n    const dots = [0, 1, 2, 3].map(i => q('[data-wdot=\"' + i + '\"]'));\n    if (panels.some(p => !p) || bars.some(b => !b)) return;\n    const D = 4.4;\n    const costEl = q('[data-wcost]');\n    const c1 = q('[data-wc1]'), c2 = q('[data-wc2]'), c3 = q('[data-wc3]');\n    const cmp = q('[data-wcmp]');\n    const tl = g.timeline({ repeat: reduce ? 0 : -1, repeatDelay: 1.6, delay: 0.8 });\n    this._tl = tl;\n    tl.set(panels, { autoAlpha: 0 }, 0);\n    [0, 1, 2, 3].forEach(i => {\n      const pos = 0.01 + i * D;\n      tl.set(dots[i], { backgroundColor: '#59a3eb', color: '#fff' }, pos);\n      tl.fromTo(bars[i], { scaleX: 0 }, { scaleX: 1, duration: D - 0.15, ease: 'none' }, pos);\n      tl.fromTo(panels[i], { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35 }, pos);\n      if (i === 0) {\n        tl.fromTo('[data-wrow]', { x: -18, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.35, stagger: 0.16, ease: 'power2.out' }, pos + 0.4);\n        const total = { v: 0 };\n        tl.to(total, { v: 7.21, duration: 1.8, ease: 'power1.inOut', onUpdate: () => { if (costEl) costEl.textContent = '$' + total.v.toFixed(2); } }, pos + 0.6);\n      }\n      if (i === 1) {\n        const o = { a: 0, b: 0, c: 0 };\n        tl.to(o, { a: 0.34, b: 210, c: 12, duration: 1.6, ease: 'power2.out', onUpdate: () => {\n          if (c1) c1.textContent = '$' + o.a.toFixed(2);\n          if (c2) c2.textContent = String(Math.round(o.b));\n          if (c3) c3.textContent = Math.round(o.c) + ' g';\n        } }, pos + 0.5);\n      }\n      if (i === 2) {\n        tl.fromTo('[data-wq]', { autoAlpha: 0, x: 18 }, { autoAlpha: 1, x: 0, duration: 0.4 }, pos + 0.4);\n        tl.fromTo('[data-wa]', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45 }, pos + 1.0);\n        tl.fromTo('[data-wcmpwrap]', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4 }, pos + 1.6);\n        const p = { v: 7.21 };\n        tl.to(p, { v: 6.62, duration: 1.0, ease: 'power2.out', onUpdate: () => { if (cmp) cmp.textContent = '$' + p.v.toFixed(2); } }, pos + 1.9);\n      }\n      if (i === 3) {\n        tl.fromTo('[data-wlrow]', { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.3, stagger: 0.1 }, pos + 0.4);\n        tl.fromTo('[data-wbadge]', { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: 'back.out(1.7)' }, pos + 1.6);\n      }\n      if (i < 3) tl.to(panels[i], { autoAlpha: 0, duration: 0.3 }, pos + D - 0.3);\n      tl.set(dots[i], { backgroundColor: '#18bc9c' }, pos + D - 0.05);\n    });\n    tl.set(dots, { backgroundColor: 'rgba(255,255,255,.14)', color: '#c4cedd' }, 4 * D + 0.5);\n  }\n\n  renderVals() {\n    const open = this.state.faqOpen;\n    const faqData = [\n      { q: 'How does the AI Agent know about my formulas?', a: 'The AI Agent reads only your workspace — recipes, ingredient library, cost assumptions, taste tests and supplier data. Nothing is shared across customers, and nothing you formulate is used to train models.' },\n      { q: 'Which label formats are supported?', a: 'US FDA 2016 Nutrition Facts, Canadian CFIA bilingual panels, Supplement Facts, dual-column and simplified formats — plus auto-generated ingredient statements and big-9 allergen declarations.' },\n      { q: 'Can we import our existing spreadsheets?', a: 'Yes. Onboarding includes a guided import for recipes, ingredients and cost data from Excel or CSV. Most teams are formulating in Flavor Studio within their first week.' },\n      { q: 'Where does the nutrition data come from?', a: 'The USDA FoodData Central database is built in, and you can add supplier spec sheets or lab assay values per ingredient. Every
