<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/v2/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/fonts.css">
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/colors.css">
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/typography.css">
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/spacing.css">
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/tokens/base.css">
  <link rel="stylesheet" href="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/styles.css">
  <script src="/v2/_ds/flavor-studio-design-system-8503a267-2a2a-425c-ae66-472fc5b59d0d/_ds_bundle.js"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #ffffff; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--blue-500); text-decoration: none; }
    a:hover { color: var(--blue-700); }
    @keyframes fsHeroPan { 0%, 100% { background-position: 50% 0%; } 50% { background-position: 50% 100%; } }
    @keyframes fsOrbA { 0%, 100% { transform: translate3d(0,0,0) scale(1); opacity: .85; } 33% { transform: translate3d(9%,-6%,0) scale(1.14); opacity: 1; } 66% { transform: translate3d(-5%,7%,0) scale(.94); opacity: .7; } }
    @keyframes fsOrbB { 0%, 100% { transform: translate3d(0,0,0) scale(1.04); opacity: .7; } 40% { transform: translate3d(-8%,8%,0) scale(.9); opacity: 1; } 70% { transform: translate3d(4%,-5%,0) scale(1.16); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</helmet>

<div style="font-family: var(--font-sans); color: var(--text-body); background: linear-gradient(180deg, #f8fafd 0%, #eef4fb 100%); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column;">
  <dc-import name="SiteNav v2" active="faq" hint-size="100%,60px"></dc-import>

  <!-- Page hero -->
  <section data-screen-label="FAQ hero" style="position: relative; background: linear-gradient(180deg, #253349 0%, #2b3d59 30%, #27374f 55%, #223047 78%, #1e2a3e 100%); background-size: 100% 220%; background-position: 50% 0%; animation: fsHeroPan 20s ease-in-out infinite; will-change: background-position; overflow: clip; padding: clamp(48px, 6vw, 80px) 24px;">
    <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none;"></div>
    <div style="position: absolute; top: 34%; left: -14%; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(96,152,220,.22) 0%, rgba(96,152,220,0) 62%); filter: blur(10px); pointer-events: none; animation: fsOrbA 17s ease-in-out infinite; will-change: transform, opacity;"></div>
    <div style="position: absolute; top: -4%; right: -16%; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(circle, rgba(98,168,86,.2) 0%, rgba(74,132,90,.08) 44%, rgba(98,168,86,0) 66%); filter: blur(12px); pointer-events: none; animation: fsOrbB 23s ease-in-out infinite; will-change: transform, opacity;"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 32%, rgba(255,255,255,.05) 0%, rgba(0,0,0,0) 46%, rgba(11,18,32,.42) 100%); pointer-events: none;"></div>
    <div style="position: relative; max-width: 1180px; margin: 0 auto; text-align: center;">
      <div data-reveal style="font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--lime-400); text-transform: uppercase;">FAQ</div>
      <h1 data-reveal data-reveal-delay="0.06" style="font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 4.2vw, 54px); line-height: 1.08; letter-spacing: -0.02em; color: #ffffff; margin: 14px auto 0;">FAQs</h1>
      <p data-reveal data-reveal-delay="0.12" style="font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; color: #aebdd0; margin: 18px auto 0; max-width: 48ch;">Commonly asked questions and answers. Something missing? <a href="/v2/contact" style="color: var(--lime-400); font-weight: 700;">Contact us</a> today.</p>
    </div>
  </section>

  <!-- Groups -->
  <section data-screen-label="FAQ groups" style="padding: clamp(48px, 6vw, 80px) 24px; flex: 1;">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(32px, 4vw, 48px);">
      <sc-for list="{{ groups }}" as="group" hint-placeholder-count="5">
        <div>
          <div data-reveal style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
            <span class="iconify" data-icon="{{ group.icon }}" style="font-size: 19px; color: var(--blue-500);"></span>
            <span style="font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--slate-800);">{{ group.title }}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="4">
              <div style="background: #fff; border: 1px solid var(--gray-300); border-radius: 18px; overflow: hidden;">
                <button onClick="{{ item.toggle }}" style="all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%; padding: 17px 22px; cursor: pointer; font-family: var(--font-sans);">
                  <span style="flex: 1; font-weight: 700; font-size: 15px; color: var(--slate-800); line-height: 1.4;">{{ item.q }}</span>
                  <span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-100); color: var(--blue-600); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; transition: transform 220ms ease; transform: rotate({{ item.rot }});">+</span>
                </button>
                <div style="display: grid; grid-template-rows: {{ item.rows }}; transition: grid-template-rows 260ms ease;">
                  <div style="overflow: hidden;">
                    <p style="margin: 0; padding: 0 22px 20px; font-size: 14.5px; line-height: 1.65; color: var(--slate-500);">{{ item.a }}</p>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- CTA -->
  <section data-screen-label="CTA" style="background: var(--slate-900); padding: clamp(56px, 8vw, 96px) 24px;">
    <div style="max-width: 720px; margin: 0 auto; text-align: center;">
      <h2 data-reveal style="font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08; letter-spacing: -0.02em; color: #fff; margin: 0;">More questions?</h2>
      <div data-reveal data-reveal-delay="0.1" style="margin-top: 28px;">
        <a href="/v2/contact" style="background: #7fd234; color: #16223a; font-size: 16px; font-weight: 800; padding: 16px 34px; border-radius: 999px; white-space: nowrap; box-shadow: 0 12px 30px rgba(127,210,52,.3); transition: transform 180ms ease; display: inline-block;" style-hover="background: #8ede40; color: #16223a; transform: translateY(-2px);">Contact us today</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter v2" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: '' };
  componentDidMount() {
    this._poll = setInterval(() => {
      if (window.gsap && window.ScrollTrigger) {
        clearInterval(this._poll);
        this._setup();
      }
    }, 80);
  }
  componentWillUnmount() {
    clearInterval(this._poll);
    if (window.ScrollTrigger) window.ScrollTrigger.getAll().forEach(t => t.kill());
  }
  _setup() {
    const g = window.gsap;
    const _io = (el, cb) => {
      if (!el) return;
      let done = false;
      const run = () => { if (done) return; done = true; cb(el); };
      const o = new IntersectionObserver((ents) => {
        ents.forEach(e => { if (e.isIntersecting) { o.unobserve(el); run(); } });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
      o.observe(el);
    };
    const _finalize = () => {
      const cp = { clearProps: 'opacity,transform,translate,rotate,scale,x,y' };
      g.utils.toArray('[data-reveal]').forEach(el => g.set(el, cp));
    };
    const _stalled = () => g.utils.toArray('[data-reveal]').some(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) return false;
      return parseFloat(getComputedStyle(el).opacity) < 0.9;
    });
    setTimeout(() => { if (_stalled()) _finalize(); }, 1800);
    setTimeout(() => { if (_stalled()) _finalize(); }, 3600);
    g.utils.toArray('[data-reveal]').forEach(el => {
      g.set(el, { y: 30, opacity: 0 });
      _io(el, t => g.to(t, { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out', delay: parseFloat(t.getAttribute('data-reveal-delay') || '0') }));
    });
  }
  renderVals() {
    const open = this.state.open;
    const groups = [
      { title: 'About Us', icon: 'icon-park-outline:home', items: [
        { q: 'How long have you been in business?', a: 'Senspire has been helping food and beverage companies bring better products to market since 2011. It began with an algorithm that predicted flavor combinations — named Inspire — and over the following decade grew into a complete suite of product-development tools for food and beverage manufacturers.' },
        { q: 'Who are your customers?', a: 'CPG manufacturers, ingredient suppliers, product developers, flavor and fragrance companies, QSR and fast casual chains, food science and culinology programs, sensory science companies, consumer research agencies, and dieticians. If you create, manufacture or supply the food and beverage industry, Flavor Studio is designed for you.' }
      ] },
      { title: 'Using Flavor Studio', icon: 'icon-park-outline:mouse', items: [
        { q: 'Is Flavor Studio easy to use?', a: 'Yes. The team invests heavily in making advanced tools intuitive — one look and it\u2019s clear how to use it. And if you ever get stuck, 24/7 support is available by phone, email, or the chat built right into the program.' },
        { q: 'Do I have to download anything? Will it run on my computer?', a: 'Nothing to download or install — Flavor Studio is completely cloud-based, runs in all current browsers, and is optimized for mobile devices without any apps.' },
        { q: 'How can Flavor Studio save me time?', a: 'It imports nutrient data straight from ingredient spec files, and automates calculations like moisture and fat loss adjustments, processing loss, nutritional analysis, costing, batch scaling and ice-cream fill weight from overrun percentage. It also speeds team communication by sharing data across recipes, projects and CRM opportunities.' },
        { q: 'Do I have to use every module?', a: 'No. Unlike an ERP, each component stands alone — sign up and use just recipes and labels today, then expand into projects, CRM or taste tests as your needs grow. Flavor Studio is flexible by design.' },
        { q: 'What collaboration tools does it offer?', a: 'User privileges and groups, defined roles, recipe sharing with per-user or per-group edit/read rights, stage/gate project management with full Gantt reporting, and a CRM module with opportunity and task support.' },
        { q: 'Can we download our data if we leave?', a: 'Yes — the API is the easiest route, and for recipes there\u2019s a button that downloads a JSON file in seconds.' }
      ] },
      { title: 'Recipes, Ingredients, and Labeling', icon: 'icon-park-outline:chef-hat-one', items: [
        { q: 'Are multiple versions of a recipe supported?', a: 'Yes — duplicate a recipe into as many versions as you need, name them for easy reference, and review every edit with the History tool. Flavor Studio records each modification, showing how a formula changed over time and by whom.' },
        { q: 'How many ingredients are in the nutritional database? Can I add my own?', a: 'Over 9,000 ingredients from the USDA\u2019s trusted SR28 database are built in. You can also add custom ingredients — most users import them from vendor spec sheets with a tool that reads a PDF and imports the nutrient values automatically.' },
        { q: 'Are compliant nutritional labels generated?', a: 'Yes — US and Canadian labels with full FDA and Health Canada compliance. As your recipe or serving sizes change, the nutritional information updates automatically.' },
        { q: 'What label layouts are supported?', a: 'All standard layouts — vertical, tabular, side-by-side, linear and dual column — plus additional vitamins and minerals beyond the mandatory four. Export as PNG for internal drafts or high-res vector PDF for your packaging designer.' },
        { q: 'Are yield adjustments taken into account?', a: 'Yes. Enter a loss amount or a target value, by percentage or gram weight, and the effect on nutrition is handled — including complex cases like ice-cream overrun, where fill weight is calculated from your overrun percentage and container size.' },
        { q: 'Can I export recipes to share with others?', a: 'Print them, download for Word, export CSV for Excel, publish read-only PDFs, or save to the encrypted FS format that carries embedded custom ingredients to Flavor Studio users outside your company.' }
      ] },
      { title: 'Pricing', icon: 'icon-park-outline:funds', items: [
        { q: 'Is there a free trial?', a: 'Yes — a 14-day, totally free trial with 100% of the functionality, no credit card required. Add as many users as you need; everything you build carries over when you become a customer.' },
        { q: 'How much does Flavor Studio cost?', a: 'From $100 per user per month billed annually ($110 monthly). Premium is $150/$165, and teams over 30 users get a custom Enterprise plan.' },
        { q: 'Are there long-term contracts or hidden fees?', a: 'No contracts — pay as you go, monthly or annually. The only charge is the licensing fee; custom development happens only if you explicitly request it.' },
        { q: 'Do you offer academic discounts?', a: 'Yes — Senspire has supported food science and culinology programs from day one. Reach out via the contact form.' }
      ] },
      { title: 'Security and Integrations', icon: 'icon-park-outline:protect', items: [
        { q: 'Is my intellectual property secure?', a: 'Data lives on highly secure servers and is shared only with your team. All web communication is TLS-encrypted, accounts use two-step authentication, and sign-on IP addresses are logged for traceability.' },
        { q: 'Can I share my login credentials?', a: 'Use the user-management module instead — multiple users can share data, projects and opportunities. Only one concurrent session is allowed per account, and two-factor authentication makes credential sharing impractical by design.' },
        { q: 'Does Flavor Studio connect with other applications?', a: 'Yes, through a full internet-based API that securely exposes all your data using industry standards — connect any ERP, accounting package or other application you choose.' }
      ] }
    ];
    return {
      groups: groups.map((gp, gi) => ({
        title: gp.title,
        icon: gp.icon,
        items: gp.items.map((f, i) => {
          const key = gi + '-' + i;
          const isOpen = open === key;
          return {
            q: f.q,
            a: f.a,
            rows: isOpen ? '1fr' : '0fr',
            rot: isOpen ? '45deg' : '0deg',
            toggle: () => this.setState({ open: isOpen ? '' : key })
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
